<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebKartX Platform</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 { font-size: 2.2rem; margin-bottom: 12px; color: #fff; }
    p { color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
    .links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      color: var(--text);
      background: #0f172a;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 WebKartX Platform</h1>
    <p>Local business digital transformation, cloud CRM automation, and multichannel messaging infrastructure.</p>
    <div class="links">
      <a href="privacy.html" class="btn btn-primary">Privacy Policy</a>
      <a href="terms.html" class="btn">Terms of Service</a>
      <a href="data-deletion.html" class="btn">Data Deletion</a>
    </div>
  </div>
</body>
</html>
